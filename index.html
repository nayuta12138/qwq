<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('images/your-background-image.jpg'); /* 使用相对路径引用本地图片 */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: rgba(205, 193, 180, 0.8);
            margin: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background-color: rgba(187, 173, 160, 0.8);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center h-screen">
    <h1 class="text-3xl font-bold mb-4 text-white">2048 Game</h1>
    <div id="board" class="board"></div>
    <div id="score" class="text-xl font-bold mt-4 text-white">Score: 0</div>
    <button id="restart" class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Restart
    </button>

    <script>
        const board = document.getElementById('board');
        const scoreElement = document.getElementById('score');
        const restartButton = document.getElementById('restart');
        let gameBoard = [];
        let score = 0;

        // 触摸事件相关变量
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        function initBoard() {
            gameBoard = Array.from({ length: 4 }, () => Array(4).fill(0));
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (gameBoard[i][j] === 0) {
                        emptyCells.push({ i, j });
                    }
                }
            }
            if (emptyCells.length > 0) {
                const randomIndex = Math.floor(Math.random() * emptyCells.length);
                const { i, j } = emptyCells[randomIndex];
                gameBoard[i][j] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (gameBoard[i][j] !== 0) {
                        cell.textContent = gameBoard[i][j];
                        cell.style.backgroundColor = getCellColor(gameBoard[i][j]);
                    }
                    board.appendChild(cell);
                }
            }
            scoreElement.textContent = `Score: ${score}`;
        }

        function getCellColor(value) {
            switch (value) {
                case 2: return 'rgba(238, 228, 218, 0.8)';
                case 4: return 'rgba(237, 224, 200, 0.8)';
                case 8: return 'rgba(242, 177, 121, 0.8)';
                case 16: return 'rgba(245, 149, 99, 0.8)';
                case 32: return 'rgba(246, 124, 95, 0.8)';
                case 64: return 'rgba(246, 94, 59, 0.8)';
                case 128: return 'rgba(237, 207, 114, 0.8)';
                case 256: return 'rgba(237, 204, 97, 0.8)';
                case 512: return 'rgba(237, 200, 80, 0.8)';
                case 1024: return 'rgba(237, 197, 63, 0.8)';
                case 2048: return 'rgba(237, 194, 46, 0.8)';
                default: return 'rgba(205, 193, 180, 0.8)';
            }
        }

        function moveLeft() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                for (let j = 1; j < 4; j++) {
                    if (gameBoard[i][j] !== 0) {
                        let k = j;
                        while (k > 0 && gameBoard[i][k - 1] === 0) {
                            gameBoard[i][k - 1] = gameBoard[i][k];
                            gameBoard[i][k] = 0;
                            k--;
                            moved = true;
                        }
                        if (k > 0 && gameBoard[i][k - 1] === gameBoard[i][k]) {
                            gameBoard[i][k - 1] *= 2;
                            score += gameBoard[i][k - 1];
                            gameBoard[i][k] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) {
                addRandomTile();
                renderBoard();
            }
        }

        function moveRight() {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                for (let j = 2; j >= 0; j--) {
                    if (gameBoard[i][j] !== 0) {
                        let k = j;
                        while (k < 3 && gameBoard[i][k + 1] === 0) {
                            gameBoard[i][k + 1] = gameBoard[i][k];
                            gameBoard[i][k] = 0;
                            k++;
                            moved = true;
                        }
                        if (k < 3 && gameBoard[i][k + 1] === gameBoard[i][k]) {
                            gameBoard[i][k + 1] *= 2;
                            score += gameBoard[i][k + 1];
                            gameBoard[i][k] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) {
                addRandomTile();
                renderBoard();
            }
        }

        function moveUp() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                for (let i = 1; i < 4; i++) {
                    if (gameBoard[i][j] !== 0) {
                        let k = i;
                        while (k > 0 && gameBoard[k - 1][j] === 0) {
                            gameBoard[k - 1][j] = gameBoard[k][j];
                            gameBoard[k][j] = 0;
                            k--;
                            moved = true;
                        }
                        if (k > 0 && gameBoard[k - 1][j] === gameBoard[k][j]) {
                            gameBoard[k - 1][j] *= 2;
                            score += gameBoard[k - 1][j];
                            gameBoard[k][j] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) {
                addRandomTile();
                renderBoard();
            }
        }

        function moveDown() {
            let moved = false;
            for (let j = 0; j < 4; j++) {
                for (let i = 2; i >= 0; i--) {
                    if (gameBoard[i][j] !== 0) {
                        let k = i;
                        while (k < 3 && gameBoard[k + 1][j] === 0) {
                            gameBoard[k + 1][j] = gameBoard[k][j];
                            gameBoard[k][j] = 0;
                            k++;
                            moved = true;
                        }
                        if (k < 3 && gameBoard[k + 1][j] === gameBoard[k][j]) {
                            gameBoard[k + 1][j] *= 2;
                            score += gameBoard[k + 1][j];
                            gameBoard[k][j] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) {
                addRandomTile();
                renderBoard();
            }
        }

        document.addEventListener('keydown', function (event) {
            switch (event.key) {
                case 'ArrowLeft': moveLeft(); break;
                case 'ArrowRight': moveRight(); break;
                case 'ArrowUp': moveUp(); break;
                case 'ArrowDown': moveDown(); break;
            }
        });

        // 触摸事件监听
        document.addEventListener('touchstart', function (event) {
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
        });

        document.addEventListener('touchend', function (event) {
            touchEndX = event.changedTouches[0].clientX;
            touchEndY = event.changedTouches[0].clientY;

            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0) {
                    moveRight();
                } else {
                    moveLeft();
                }
            } else {
                if (deltaY > 0) {
                    moveDown();
                } else {
                    moveUp();
                }
            }
        });

        restartButton.addEventListener('click', function () {
            score = 0;
            initBoard();
        });

        initBoard();
    </script>
</body>

</html>
